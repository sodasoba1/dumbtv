name: Control Centre test build

on:
  pull_request:
    paths:
      - "tools/control-centre/**"
      - ".github/workflows/control-centre.yml"
  push:
    branches: [main]
    paths:
      - "tools/control-centre/**"
      - ".github/workflows/control-centre.yml"
  workflow_dispatch:

concurrency:
  group: control-centre-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows-test-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve and inspect ADB dependency features
        working-directory: tools/control-centre
        run: |
          cargo generate-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $features = cargo tree -e features -i libadb | Out-String
          Write-Output $features
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($features -match 'libadb feature "keys"' -or $features -match 'libadb feature "host-keys"') {
            throw "The optional libadb RSA key features must remain disabled."
          }

      - name: Commit generated lockfile and rustfmt output to the same-repository PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        shell: pwsh
        env:
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock src
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: lock Control Centre dependencies"
            if ($LASTEXITCODE -ne 0) { throw "Could not commit Cargo.lock" }
            git push origin "HEAD:refs/heads/$env:PR_BRANCH"
            if ($LASTEXITCODE -ne 0) { throw "Could not push Cargo.lock to the PR branch" }
          } else {
            Write-Output "Cargo.lock is already committed and unchanged."
          }

      - name: Install prebuilt RustSec audit tool
        uses: taiki-e/install-action@v2.90.3
        with:
          tool: cargo-audit@0.22.2
          fallback: none

      - name: Audit the complete locked dependency graph
        working-directory: tools/control-centre
        run: |
          cargo audit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install cargo-about licence inventory tool
        uses: taiki-e/install-action@v2.90.3
        with:
          tool: cargo-about@0.9.3
          fallback: none

      - name: Generate complete locked dependency licence texts
        working-directory: tools/control-centre
        run: |
          cargo about generate -o THIRD-PARTY-LICENSES.md about.hbs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "THIRD-PARTY-LICENSES.md") -or (Get-Item "THIRD-PARTY-LICENSES.md").Length -lt 1000) {
            throw "cargo-about did not produce a complete third-party licence inventory."
          }

      - name: Check Rust formatting
        working-directory: tools/control-centre
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Rust Clippy
        working-directory: tools/control-centre
        run: |
          cargo clippy --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile and run unit tests
        working-directory: tools/control-centre
        run: |
          cargo test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build portable Windows executable
        working-directory: tools/control-centre
        run: |
          cargo build --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package portable test build
        working-directory: tools/control-centre
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP "DumbTV-Control-Centre-test"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item "target/release/dumbtv-control-centre.exe" $package
          Copy-Item "README.md" $package
          Copy-Item "THIRD-PARTY-NOTICES.md" $package
          Copy-Item "THIRD-PARTY-LICENSES.md" $package
          Copy-Item "../../LICENSE" $package
          Copy-Item "Cargo.lock" $package
          Compress-Archive -Path (Join-Path $package "*") -DestinationPath (Join-Path $env:RUNNER_TEMP "DumbTV-Control-Centre-test-windows-x64.zip") -Force

      - name: Upload resolved Cargo lockfile for dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-centre-cargo-lock
          path: tools/control-centre/Cargo.lock
          if-no-files-found: error
          retention-days: 14

      - name: Upload generated third-party licence inventory
        uses: actions/upload-artifact@v4
        with:
          name: control-centre-third-party-licences
          path: tools/control-centre/THIRD-PARTY-LICENSES.md
          if-no-files-found: error
          retention-days: 14

      - name: Upload portable test build
        uses: actions/upload-artifact@v4
        with:
          name: DumbTV-Control-Centre-test-windows-x64
          path: ${{ runner.temp }}/DumbTV-Control-Centre-test-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
