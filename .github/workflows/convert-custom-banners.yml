name: Convert custom banner SVGs

on:
  push:
    branches:
      - "**"
    paths:
      - "custom/**/*.svg"
      - "scripts/convert_custom_banners.py"
      - ".github/workflows/convert-custom-banners.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: custom-banners-${{ github.ref }}
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SVG conversion dependencies
        run: python -m pip install --disable-pip-version-check cairosvg pillow

      - name: Convert SVG banners
        run: python scripts/convert_custom_banners.py

      - name: Commit generated banner PNGs
        shell: bash
        run: |
          set -euo pipefail
          git add launcher/src/main/assets/custom-banners
          if git diff --cached --quiet; then
            echo "Generated banner assets are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate custom banner PNGs"
          git push origin "HEAD:${GITHUB_REF_NAME}"
