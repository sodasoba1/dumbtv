name: validate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install --quiet pyyaml
      - run: python3 catalog/validate.py

  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: sdk
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-25" "build-tools;34.0.0" < <(yes) >/dev/null
      - name: build (pinned SDK 25 + build-tools 34.0.0; fails on Android APIs newer than Fire OS 6)
        env:
          ANDROID_BUILD_TOOLS_VERSION: "34.0.0"
        run: ./launcher/build.sh
      - name: host-side launcher tests
        run: |
          jar="$ANDROID_HOME/platforms/android-25/android.jar"
          javac --release 8 -Xlint:all -Werror -d /tmp/host launcher/src/tv/dumbtv/home/HomeRetry.java \
            launcher/tests/HomeRetryTest.java
          java -cp /tmp/host tv.dumbtv.home.HomeRetryTest
          javac --release 8 -Xlint:all -Werror -d /tmp/config-host \
            launcher/tests/stubs/android/*/*.java launcher/src/tv/dumbtv/home/Config.java \
            launcher/tests/ConfigTest.java
          java -cp /tmp/config-host tv.dumbtv.home.ConfigTest
          javac --release 8 -Xlint:all -Werror -d /tmp/host launcher/src/tv/dumbtv/home/IconMatch.java \
            launcher/tests/IconMatchTest.java
          java -cp /tmp/host tv.dumbtv.home.IconMatchTest
          javac -d /tmp/host -cp "$jar" launcher/src/tv/dumbtv/home/FocusColor.java \
            launcher/src/tv/dumbtv/home/Config.java launcher/src/tv/dumbtv/home/Library.java \
            launcher/src/tv/dumbtv/home/Recent.java launcher/tests/FocusColorTest.java
          java -cp "/tmp/host:$jar" tv.dumbtv.home.FocusColorTest
          javac -d /tmp/host -cp "/tmp/host:$jar" launcher/src/tv/dumbtv/home/Recent.java \
            launcher/tests/RecentTest.java
          java -cp "/tmp/host:$jar" tv.dumbtv.home.RecentTest
          javac --release 8 -Xlint:all -Werror -d /tmp/config-host -cp "$jar:/tmp/config-host" \
            launcher/src/tv/dumbtv/home/Item.java launcher/src/tv/dumbtv/home/Recent.java \
            launcher/src/tv/dumbtv/home/Catalog.java launcher/tests/AppSectionsTest.java
          java -cp "/tmp/config-host:$jar" tv.dumbtv.home.AppSectionsTest
          javac -d /tmp/host -cp "/tmp/host:$jar" launcher/src/tv/dumbtv/home/Ui.java \
            launcher/src/tv/dumbtv/home/Meter.java launcher/tests/MeterTest.java
          java -cp "/tmp/host:$jar" tv.dumbtv.home.MeterTest
          javac -d /tmp/host -cp "/tmp/host:$jar" launcher/tests/LibraryTest.java
          java -cp "/tmp/host:$jar" tv.dumbtv.home.LibraryTest
      - name: verify APK identity, SDK, alignment, signature and checksum
        run: |
          apk=launcher/build/dumbtv-home.apk
          tools="$ANDROID_HOME/build-tools/34.0.0"
          source launcher/version.env
          badging=$("$tools/aapt2" dump badging "$apk")
          grep -F "package: name='tv.dumbtv.home' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'" <<<"$badging"
          grep -Fx "sdkVersion:'25'" <<<"$badging"
          grep -Fx "targetSdkVersion:'28'" <<<"$badging"
          "$tools/zipalign" -c -v 4 "$apk"
          "$tools/apksigner" verify --verbose "$apk"
          expected=$(tr -d '[:space:]' < launcher/build/dumbtv-home.apk.sha256)
          actual=$(sha256sum "$apk" | awk '{print $1}')
          [[ "$expected" == "$actual" && "$expected" =~ ^[0-9a-f]{64}$ ]]

      - name: one permission on Fire OS 7 and later
        run: |
          # Fire OS 6's Keeper pair is capped at sdk 27; RECEIVE_BOOT_COMPLETED starts Keeper after boot.
          dump=$("$ANDROID_HOME/build-tools/34.0.0/aapt2" dump permissions launcher/build/dumbtv-home.apk)
          echo "$dump"
          extra=$(echo "$dump" | grep uses-permission | grep -v "maxSdkVersion='27'" \
            | grep -v "name='android.permission.RECEIVE_BOOT_COMPLETED'" || true)
          [ -z "$extra" ] || { echo "the launcher may only request RECEIVE_BOOT_COMPLETED on sdk 28+, found: $extra"; exit 1; }
          n=$(echo "$dump" | grep -c uses-permission || true)
          [ "$n" -le 3 ] || { echo "expected at most the 3 Fire OS 6 permissions, found $n"; exit 1; }

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: syntax
        run: for f in scripts/*.sh launcher/*.sh; do bash -n "$f" || exit 1; done
      - name: Pi-hole export consistency
        run: python3 scripts/export-pihole-lists.py --check
      - name: offline script tests (no device)
        run: python3 -m unittest discover -s tests -v
      - name: launcher version manifest
        run: ./launcher/release-check.sh --manifest
      - name: no private addresses or hardware ids
        run: |
          if grep -rnE '\b(10|172|192)\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\b|\b([0-9a-fA-F]{2}:){5}[0-9a-fA-F]{2}\b' \
               --exclude-dir=.git --exclude-dir=report \
               --include='*.md' --include='*.sh' --include='*.txt' --include='*.yaml' \
               --include='*.yml' --include='*.json' --include='*.py' .; then
            echo "remove the private addresses above; they belong in dumbtv.conf, not the repo"; exit 1
          fi
