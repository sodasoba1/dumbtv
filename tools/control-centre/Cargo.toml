[package]
name = "dumbtv-control-centre"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Windows test Control Centre for the AFTMM DumbTV project"
license = "MIT"
publish = false

[[bin]]
name = "dumbtv-control-centre"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
md-5 = "0.10"
num-bigint = "0.4"
sha1 = "0.11"
sha2 = "0.10"
atomicwrites = "0.4"
dirs = "6.0"
libadb = { version = "=0.9.0", default-features = false, features = ["tokio"] }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["net", "rt-multi-thread", "time"] }
zip = { version = "=9.0.5", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography"] }
