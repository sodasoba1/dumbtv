[package]
name = "dumbtv-control-centre"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Windows test Control Centre for the AFTMM DumbTV project"
license = "MIT"
publish = false

[[bin]]
name = "dumbtv-control-centre"
path = "src/main.rs"

[dependencies]
atomicwrites = "0.4"
dirs = "6.0"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
