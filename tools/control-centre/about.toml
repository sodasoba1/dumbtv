  "MIT",
  "BSD-3-Clause",
  "BSD-2-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "OFL-1.1",
  "BSL-1.0",
  "Unlicense",
  "0BSD",
  "CDLA-Permissive-2.0",
